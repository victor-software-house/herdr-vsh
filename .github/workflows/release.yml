# The fork's release: push a tag `fork-v<version>-<n>` on downstream. macOS only
# for now: scripts/fork-release-macos builds, signs and notarizes Herdr Fork.app,
# and the zip goes to the tag's GitHub Release.
name: release
run-name: release ${{ github.ref_name }}

on:
  push:
    tags: ["fork-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.95.0

jobs:
  macos:
    runs-on: macos-15
    # The Apple secrets live in this environment, open to fork-v* tags only.
    environment: release
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-aarch64-release
          cache-bin: false
      - name: Build, sign and notarize
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/fork-release-macos "dist/Herdr-Fork-${GITHUB_REF_NAME}-macos-aarch64.zip"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.zip
          --repo "$GITHUB_REPOSITORY" --title "Herdr Fork $GITHUB_REF_NAME"
          --notes "Herdr with Ghostty-like rendering. Apple Silicon: unzip, move Herdr Fork.app to Applications, open it. Derived from Herdr (https://github.com/herdrdev/herdr-app), Apache-2.0."
